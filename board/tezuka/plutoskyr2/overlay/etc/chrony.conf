# PlutoSky R2. As the common chrony.conf; to use a 1PPS on EXT_IO0 (JP5,
# 3.3 V; routed to /dev/pps0 by the simple bitstream), add a time source that
# numbers the seconds, e.g. an NTP server with good offset, and:
#   refclock PPS /dev/pps0 refid PPS lock <that source's refid> poll 2 prefer
pool pool.ntp.org iburst minpoll 4 maxpoll 8
makestep 1 -1
rtcsync
allow
