# NTP servers. Replace with a LAN server for better frequency accuracy
# (see /usr/share/doc/trxd/REFERENCE.md: internet NTP gives tens of ppb).
pool pool.ntp.org iburst minpoll 4 maxpoll 8

# GPS time from gpsd (NMEA, shared memory). Coarse (~100 ms) on its own.
refclock SHM 0 refid NMEA offset 0.0 precision 1e-1 poll 3 noselect

makestep 1 -1
rtcsync

# Serve time to the LAN once synchronised.
allow
